name: Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    if: github.repository_owner_id != '186206138'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10
          args: --timeout=5m

  test-unix:
    if: github.repository_owner_id != '186206138'
    needs: [lint]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: macos-14
            goos: darwin
            goarch: arm64
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Run tests
        run: go test ./...

      - name: Build binary
        run: |
          CGO_ENABLED=1 go build \
            -o codebase-memory-mcp \
            ./cmd/codebase-memory-mcp/

      - name: Smoke test
        run: bash scripts/smoke-test.sh ./codebase-memory-mcp

  test-asan:
    if: github.repository_owner_id != '186206138'
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Test with AddressSanitizer
        env:
          CGO_CFLAGS: "-fsanitize=address -fno-omit-frame-pointer"
          CGO_LDFLAGS: "-fsanitize=address"
        run: go test -count=1 -timeout=10m ./...

      - name: Memory stability check
        run: go test -run TestMemoryStability -v -count=1 -timeout=5m ./internal/pipeline/

  test-windows:
    if: github.repository_owner_id != '186206138'
    needs: [lint]
    runs-on: windows-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Run tests
        shell: msys2 {0}
        run: |
          which go
          go version
          go test ./...

      - name: Build binary
        shell: msys2 {0}
        run: |
          CGO_ENABLED=1 CC=gcc go build \
            -o codebase-memory-mcp.exe \
            ./cmd/codebase-memory-mcp/

      - name: Smoke test
        shell: msys2 {0}
        run: bash scripts/smoke-test.sh ./codebase-memory-mcp.exe
