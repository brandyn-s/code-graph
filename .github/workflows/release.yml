name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.0.2)"
        required: true
        type: string
      release_notes:
        description: "Release notes (optional — auto-generated from commits if empty)"
        required: false
        type: string

concurrency:
  group: code-graph-release
  cancel-in-progress: false

# Workflow-level default. Jobs are read-only unless they declare the narrowly
# scoped write permissions needed to attest or publish a release.
permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test fail-closed release state machine
        run: |
          python3 -m unittest \
            scripts.test_release_version \
            scripts.test_release_workflow \
            scripts.test_release_workflow_acceptance

      - name: Verify immutable release inputs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: bash scripts/release_workflow.sh validate

  lint:
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Run publication-equivalent lint
        uses: ./.github/actions/release-lint

      - name: Report full lint debt
        continue-on-error: true
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10
          args: --timeout=10m

  build-unix:
    needs: [lint]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: macos-14
            goos: darwin
            goarch: arm64
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Run tests
        run: go test ./...

      - name: Build binary
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Strip leading 'v' — version var should be bare semver (e.g. 0.4.0)
          CLEAN_VERSION="${VERSION#v}"
          # Default build: grammars behind the cbm_all tag (CUDA) are excluded
          # to keep release archives small. See docs/upstream.md.
          CGO_ENABLED=1 go build \
            -ldflags "-X main.version=$CLEAN_VERSION" \
            -o code-graph \
            ./cmd/code-graph/

      - name: Smoke test
        run: bash scripts/smoke-test.sh ./code-graph

      - name: Create archive
        run: tar -czf code-graph-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz code-graph

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-graph-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "*.tar.gz"
          # The GitHub Release is the durable distribution artifact. These
          # intermediate files only need to survive attestation and publish.
          retention-days: 1

  build-windows:
    needs: [lint]
    runs-on: windows-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Run tests
        shell: msys2 {0}
        run: |
          which go
          go version
          go test ./...

      - name: Build binary
        shell: msys2 {0}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Strip leading 'v' — version var should be bare semver (e.g. 0.4.0)
          CLEAN_VERSION="${VERSION#v}"
          CGO_ENABLED=1 CC=gcc go build \
            -ldflags "-X main.version=$CLEAN_VERSION -extldflags '-static'" \
            -o code-graph.exe \
            ./cmd/code-graph/

      - name: Smoke test
        shell: msys2 {0}
        run: bash scripts/smoke-test.sh ./code-graph.exe

      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path code-graph.exe -DestinationPath code-graph-windows-amd64.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-graph-windows-amd64
          path: "*.zip"
          retention-days: 1

  attest:
    needs: [build-unix, build-windows]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Generate checksums for attestation subjects
        run: sha256sum -- *.tar.gz *.zip > checksums.txt

      - name: Generate build provenance attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: checksums.txt

  release:
    needs: [attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum -- *.tar.gz *.zip > checksums.txt

      - name: Recheck immutable release inputs
        id: release-state
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: bash scripts/release_workflow.sh validate

      - name: Create immutable tag if absent
        env:
          TAG_EXISTS: ${{ steps.release-state.outputs.tag_exists }}
          VERSION: ${{ inputs.version }}
        run: bash scripts/release_workflow.sh tag

      - name: Create or resume immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_STATE: ${{ steps.release-state.outputs.release_state }}
          VERSION: ${{ inputs.version }}
        run: bash scripts/release_workflow.sh publish
