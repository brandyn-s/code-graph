name: Core CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A newer PR commit supersedes older deterministic runs. Main runs remain
  # serialized in their own ref and are not cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
          allowed-endpoints: >
            raw.githubusercontent.com:443
            golangci-lint.run:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true

      - name: Run publication-equivalent lint
        uses: ./.github/actions/release-lint

      - name: Test
        run: go test ./...

      - name: Build production binary
        run: CGO_ENABLED=1 go build -o /tmp/code-graph ./cmd/code-graph/

      - name: Smoke test production binary
        run: bash scripts/smoke-test.sh /tmp/code-graph

      - name: Lint shell installers
        run: |
          bash -n install.sh scripts/setup.sh scripts/smoke-test.sh scripts/release_workflow.sh
          shellcheck install.sh scripts/setup.sh scripts/smoke-test.sh scripts/update-homebrew-formula.sh scripts/update-server-json.sh

  agent-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Compare runtime and generated tool schemas
        run: python3 bench/research/agent-effectiveness/generate_schemas.py --check-only

      - name: Run agent contract tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 bench/research/agent-effectiveness/test_generate_schemas.py
          python3 bench/research/agent-effectiveness/test_run_battery_offline.py
          python3 bench/research/agent-effectiveness/test_run_battery_strict.py

      - name: Verify required workflow structure
        run: python3 -m unittest scripts.test_core_ci_workflow scripts.test_sanitizer_workflows

      - name: Build contract-test binary
        run: CGO_ENABLED=1 go build -o /tmp/code-graph ./cmd/code-graph/

      - name: Index checked-in Go fixture
        run: |
          fixture_path="$GITHUB_WORKSPACE/bench/accuracy/synthetic/go-minimal"
          args="$(python3 -c 'import json,sys; print(json.dumps({"repo_path": sys.argv[1], "skip_report": True}))' "$fixture_path")"
          /tmp/code-graph cli --raw index_repository "$args"

      - name: Run zero-cost category-6 battery
        env:
          CODE_GRAPH_BIN: /tmp/code-graph
          CORPUS_RIPGREP_PATH: ${{ github.workspace }}/bench/accuracy/synthetic/go-minimal
          AGENT_EFFECTIVENESS_RESULTS_FILE: ${{ runner.temp }}/agent-effectiveness-results.jsonl
        run: |
          cd bench/research/agent-effectiveness
          python3 run_battery.py \
            --filter-category 6 \
            --filter-target ripgrep \
            --strict-contract \
            --no-skip

  test-platforms:
    # The release matrix ships darwin and windows binaries; the cgo grammars
    # and path handling are where platforms diverge, so the unit suite runs
    # on both in addition to the Linux core job.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            experimental: false
          - os: windows-latest
            experimental: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 40
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true

      - name: Setup MSYS2 toolchain (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: CGO_ENABLED=1 CC=gcc go test ./...

      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: go test ./...

  merge-gate:
    needs: [core, agent-contract, test-platforms]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Require all deterministic jobs
        env:
          CORE_RESULT: ${{ needs.core.result }}
          AGENT_CONTRACT_RESULT: ${{ needs.agent-contract.result }}
          PLATFORMS_RESULT: ${{ needs.test-platforms.result }}
        run: |
          if [ "$CORE_RESULT" != "success" ] ||
             [ "$AGENT_CONTRACT_RESULT" != "success" ] ||
             [ "$PLATFORMS_RESULT" != "success" ]; then
            echo "Required job failure: core=$CORE_RESULT agent-contract=$AGENT_CONTRACT_RESULT test-platforms=$PLATFORMS_RESULT"
            exit 1
          fi
          echo "All deterministic required jobs succeeded."
