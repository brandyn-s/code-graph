version: "2"
run:
  go: "1.26"
linters:
  enable:
    - bodyclose
    - cyclop
    - durationcheck
    - funlen
    - gocognit
    - gocritic
    - gosec
    - makezero
    - misspell
    - nestif
    - nilerr
    - noctx
    - prealloc
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
  settings:
    cyclop:
      max-complexity: 30
    errcheck:
      check-type-assertions: true
    funlen:
      lines: 140
      statements: 90
    gocognit:
      min-complexity: 65
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    gosec:
      excludes:
        - G115
        - G404
        - G704
        - G705
        - G706
    nestif:
      min-complexity: 20
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - vendor
      - third_party$
      - builtin$
      - examples$
    rules:
      # internal/cbm is hand-written tree-sitter AST extraction + CGO glue — the
      # riskiest code in the repo. It was previously excluded from ALL linting.
      # Bring it under gosec and the safety linters (bodyclose, rowserrcheck,
      # sqlclosecheck, makezero, nilerr, noctx, ...), but exempt the complexity
      # and style linters: the extraction code is inherently large and branchy
      # by design, and the C side is covered by the ASan CI job (asan.yml).
      - path: internal/cbm
        linters:
          - funlen
          - gocognit
          - cyclop
          - nestif
          - gocritic
          - prealloc
          - unparam
      # G103 ("audit use of unsafe") fires on every CGO marshalling site
      # (unsafe.Pointer / unsafe.Slice over C arrays) — unavoidable and
      # informational for tree-sitter interop. The real memory-safety check for
      # this C-interop is the ASan CI job (asan.yml); keep the rest of gosec on.
      - path: internal/cbm
        text: "G103"
        linters:
          - gosec
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - vendor
      - third_party$
      - builtin$
      - examples$
