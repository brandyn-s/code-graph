name: "research: agent-effectiveness"

# Regression gate for the agent-as-end-user layer. Catches the 6 failure-mode
# categories that the per-extractor accuracy-regression.yml does NOT see:
#
#   1. Banner / sidecar interference with CLI extraction
#   2. Default-too-verbose responses bloating agent context
#   3. Tool-schema drift (agent's declared schema != handler)
#   4. Missing tool surface for a question class (max_turns_exhausted)
#   5. CLI vs MCP transport divergence (offline unit tests, not this workflow)
#   6. Output-shape regressions (schema-validated, no LLM cost)
#
# Triggered when PR touches the agent-effectiveness contract surface:
# tool handlers, store, MCP server entry point, or the bench itself.
#
# Cost: category 6 (schema) = $0; category 1 on ripgrep (5 LLM questions) = ~$2.
# Total <= $3/PR. PSM-scale tests (categories 2 and 4) are NOT runnable in CI
# because PSM is a developer-local checkout — those run locally via:
#   python bench/research/agent-effectiveness/run_battery.py
#

on:
  workflow_dispatch:
    inputs:
      filter_category:
        description: 'Only run a single category (1=banner, 2=verbosity, 3=schema, 4=missing, 6=output-shape)'
        required: false
        default: ''
      budget_usd:
        description: 'Total cost cap; abort run when exceeded'
        required: false
        default: '5'

permissions:
  contents: read

jobs:
  agent-effectiveness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=""
          [ -z "$ANTHROPIC_API_KEY" ] && missing="$missing ANTHROPIC_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::This research workflow needs the$missing secret(s); configure them on the repository or skip this workflow. Zero-cost checks already run in Core CI."
            exit 1
          fi


      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.13'

      - name: Install Python deps
        run: pip install anthropic

      - name: Drift gate — agent TOOL_SCHEMAS must match handler InputSchemas
        run: |
          # Re-run codegen in check-only mode. Non-zero exit if the
          # committed _generated_tool_schemas.py differs from what the
          # generator would produce from current internal/tools/*.go.
          # Forces the contributor to re-run codegen + commit before merge.
          python bench/research/agent-effectiveness/generate_schemas.py --check-only

      - name: Build code-graph binary
        run: |
          CGO_ENABLED=1 go build -o bin/code-graph ./cmd/code-graph/
          chmod +x bin/code-graph

      - name: Clone ripgrep fixture
        run: |
          mkdir -p "$HOME/fixture"
          git clone --depth=1 https://github.com/BurntSushi/ripgrep.git "$HOME/fixture/ripgrep"

      - name: Index ripgrep
        env:
          CODE_GRAPH_BIN: ${{ github.workspace }}/bin/code-graph
        run: |
          "$CODE_GRAPH_BIN" cli index_repository "{\"path\":\"$HOME/fixture/ripgrep\"}"

      - name: Fresh start — clear stale results.jsonl
        run: |
          # run_battery.py appends to results.jsonl and the file is
          # committed in the repo as a developer-local resume
          # checkpoint. On CI we want a clean slate so the
          # post-summary step renders THIS run's results, not
          # historical PSM rows from the developer who committed
          # last. Truncate (don't delete) so the schema runner's
          # append-mode open still works.
          : > bench/research/agent-effectiveness/results.jsonl

      - name: Run category 6 (schema validation; no API cost)
        env:
          CODE_GRAPH_BIN: ${{ github.workspace }}/bin/code-graph
        run: |
          cd bench/research/agent-effectiveness
          # corpus.json hard-codes a developer-machine ripgrep path +
          # the project_id derived from it. CI clones the fixture to
          # $HOME/fixture/ripgrep which produces a different project_id
          # ("home-runner-fixture-ripgrep" on ubuntu runners). Without
          # this override the schema battery queries a non-existent
          # project and every question fails. run_battery.py's
          # load_targets reads CORPUS_<TARGET>_PATH and recomputes
          # project_id via project_id.project_name_from_path.
          export CORPUS_RIPGREP_PATH="$HOME/fixture/ripgrep"
          # Schema questions are PSM-only by default; for CI, swap to ripgrep
          # by passing --filter-target ripgrep. Tools without ripgrep-friendly
          # args are skipped via the runner's target match.
          python run_battery.py --filter-category 6 --filter-target ripgrep

      - name: Run category 1 (banner; ~$2 on ripgrep)
        env:
          CODE_GRAPH_BIN: ${{ github.workspace }}/bin/code-graph
        run: |
          cd bench/research/agent-effectiveness
          export CORPUS_RIPGREP_PATH="$HOME/fixture/ripgrep"
          python run_battery.py --filter-category 1 --filter-target ripgrep --budget-usd ${{ github.event.inputs.budget_usd || '3' }}

      - name: Run additional categories on manual dispatch
        env:
          CODE_GRAPH_BIN: ${{ github.workspace }}/bin/code-graph
        run: |
          cd bench/research/agent-effectiveness
          export CORPUS_RIPGREP_PATH="$HOME/fixture/ripgrep"
          CATEGORY_FILTER="${{ github.event.inputs.filter_category }}"
          if [ -n "$CATEGORY_FILTER" ]; then
            python run_battery.py --filter-category $CATEGORY_FILTER --filter-target ripgrep --budget-usd ${{ github.event.inputs.budget_usd || '5' }}
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-effectiveness-results
          path: bench/research/agent-effectiveness/results.jsonl
          if-no-files-found: warn
