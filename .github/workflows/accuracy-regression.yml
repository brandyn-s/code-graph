# Accuracy regression gate.
#
# Triggers on PRs that touch extractor pipeline code or accuracy harness.
# Builds the binary, runs the synthetic Nix pub/sub fixture, asserts edge
# extraction matches ground truth exactly. Exits non-zero on any FN/FP.
#
# Why a separate workflow: the main CI runs unit tests; this is a
# behavioral check against a real (small) graph.

name: accuracy-regression

on:
  pull_request:
    paths:
      - "internal/pipeline/nix_services.go"
      - "internal/pipeline/zenoh.go"
      - "bench/accuracy/check_nix_synthetic.py"
      - "bench/accuracy/synthetic/nix-pubsub-minimal/**"
      - ".github/workflows/accuracy-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix-pubsub:
    name: Nix pub/sub synthetic fixture
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build codebase-memory-mcp
        run: |
          CGO_ENABLED=1 go build -o bin/codebase-memory-mcp ./cmd/codebase-memory-mcp/

      - name: Run synthetic Nix pub/sub regression check
        run: |
          python bench/accuracy/check_nix_synthetic.py \
            --binary "$PWD/bin/codebase-memory-mcp" \
            --fixture "$PWD/bench/accuracy/synthetic/nix-pubsub-minimal"
