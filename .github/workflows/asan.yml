name: asan

# AddressSanitizer gate for the C extraction path. internal/cbm is hand-written
# tree-sitter AST extraction + CGO glue (unsafe.Pointer / unsafe.Slice over C
# arrays) — the riskiest memory-safety surface in the repo and the part gosec
# cannot analyze (gosec G103 is excluded for internal/cbm in .golangci.yml).
#
# dry-run.yml already runs ASan over ./... on manual dispatch; this workflow
# runs ASan AUTOMATICALLY whenever a PR touches the C-interop code, so a
# use-after-free / out-of-bounds in the extraction layer is caught at review
# time rather than only when someone remembers to dispatch the dry run.

on:
  pull_request:
    paths:
      - "internal/cbm/**"
      - "internal/pipeline/**"
      - "internal/lang/**"
      - "tree-sitter-*/**"
      - ".github/workflows/asan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asan:
    if: github.repository_owner_id != '186206138'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Test C extraction path under AddressSanitizer
        env:
          CGO_CFLAGS: "-fsanitize=address -fno-omit-frame-pointer"
          CGO_LDFLAGS: "-fsanitize=address"
        run: go test -count=1 -timeout=15m ./internal/cbm/... ./internal/pipeline/...
