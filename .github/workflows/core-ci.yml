name: Core CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true

      - name: Test
        run: go test ./...

      - name: Build production binary
        run: CGO_ENABLED=1 go build -o /tmp/codebase-memory-mcp ./cmd/codebase-memory-mcp/

      - name: Smoke test production binary
        run: bash scripts/smoke-test.sh /tmp/codebase-memory-mcp

  agent-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Compare runtime and generated tool schemas
        run: python3 bench/research/agent-effectiveness/generate_schemas.py --check-only

      - name: Run agent contract tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 bench/research/agent-effectiveness/test_generate_schemas.py
          python3 bench/research/agent-effectiveness/test_run_battery_offline.py
          python3 bench/research/agent-effectiveness/test_run_battery_strict.py

      - name: Verify required workflow structure
        run: python3 -m unittest scripts.test_core_ci_workflow

      - name: Build contract-test binary
        run: CGO_ENABLED=1 go build -o /tmp/codebase-memory-mcp ./cmd/codebase-memory-mcp/

      - name: Index checked-in Go fixture
        run: |
          fixture_path="$GITHUB_WORKSPACE/bench/accuracy/synthetic/go-minimal"
          args="$(python3 -c 'import json,sys; print(json.dumps({"repo_path": sys.argv[1], "skip_report": True}))' "$fixture_path")"
          /tmp/codebase-memory-mcp cli --raw index_repository "$args"

      - name: Run zero-cost category-6 battery
        env:
          CODE_GRAPH_BIN: /tmp/codebase-memory-mcp
          CORPUS_RIPGREP_PATH: ${{ github.workspace }}/bench/accuracy/synthetic/go-minimal
          AGENT_EFFECTIVENESS_RESULTS_FILE: ${{ runner.temp }}/agent-effectiveness-results.jsonl
        run: |
          cd bench/research/agent-effectiveness
          python3 run_battery.py \
            --filter-category 6 \
            --filter-target ripgrep \
            --strict-contract \
            --no-skip

  merge-gate:
    needs: [core, agent-contract]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Require all deterministic jobs
        env:
          CORE_RESULT: ${{ needs.core.result }}
          AGENT_CONTRACT_RESULT: ${{ needs.agent-contract.result }}
        run: |
          if [ "$CORE_RESULT" != "success" ] ||
             [ "$AGENT_CONTRACT_RESULT" != "success" ]; then
            echo "Required job failure: core=$CORE_RESULT agent-contract=$AGENT_CONTRACT_RESULT"
            exit 1
          fi
          echo "All deterministic required jobs succeeded."
