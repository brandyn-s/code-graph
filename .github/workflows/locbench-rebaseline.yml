name: "research: locbench-rebaseline"

# Manually dispatched. Re-baselines code-graph's localizer on the PINNED
# reachable Loc-Bench subset, so the number is apples-to-apples over time
# instead of a fresh random sample that also pulls in GC'd, clone-failing
# instances. This restores a defensible figure for the 86.0/84.5/73.5 baseline,
# which is currently flagged historical (CLAUDE.md / the 2026-05-12
# unreachable-tail finding). See
# the locbench rebaseline runbook (kept with the bench tooling).
#
# Pipeline: build binaries -> download Loc-Bench parquet -> pin the reachable
# subset (GITHUB_TOKEN) -> run the localizer on the pinned subset (budget
# capped). Needs ANTHROPIC_API_KEY (fails fast if absent); VOYAGE_API_KEY is
# optional (enables embedding seeds). The SweRank comparison arm is the one
# remaining build step (documented in the runbook).

on:
  workflow_dispatch:
    inputs:
      budget_usd:
        description: 'Hard cost cap for the agent runs (USD)'
        required: false
        default: '5'

permissions:
  contents: read

jobs:
  rebaseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=""
          [ -z "$ANTHROPIC_API_KEY" ] && missing="$missing ANTHROPIC_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::This research workflow needs the$missing secret(s); configure them on the repository or skip this workflow. Zero-cost checks already run in Core CI."
            exit 1
          fi


      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.13'

      - name: Install Python deps
        run: pip install anthropic pandas pyarrow datasets

      - name: Build binaries (harness hard-codes .exe names)
        run: |
          CGO_ENABLED=1 go build -o bin/code-graph.exe ./cmd/code-graph/
          CGO_ENABLED=1 go build -o bench/research/eval_rank_localize/eval.exe ./bench/research/eval_rank_localize/

      - name: Download Loc-Bench parquet
        run: |
          python -c "from datasets import load_dataset; load_dataset('czlll/Loc-Bench_V1', split='test').to_parquet('bench/research/locbench.parquet')"

      - name: Pin reachable subset (GitHub commits API + Software Heritage)
        run: |
          python bench/accuracy/locbench_reachability.py \
            --instances bench/research/locbench_v1_instances.json \
            --pin bench/accuracy/locbench_reachable_pin.json

      - name: Re-baseline on the pinned subset (budget-capped)
        run: |
          LOCAGENT_ITERATIONS=2 python bench/research/eval_locbench_batch.py \
            --instances bench/accuracy/locbench_reachable_pin.json \
            --budget-usd "${{ github.event.inputs.budget_usd }}" \
            --workdir "$RUNNER_TEMP/locbench-wd" \
            --output "$RUNNER_TEMP/rebaseline.md" \
            --per-case-json "$RUNNER_TEMP/rebaseline-cases.json"

      - name: Upload pin + results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: locbench-rebaseline
          path: |
            bench/accuracy/locbench_reachable_pin.json
            ${{ runner.temp }}/rebaseline.md
            ${{ runner.temp }}/rebaseline-cases.json
          if-no-files-found: warn
