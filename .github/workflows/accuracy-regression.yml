name: accuracy-regression

# Regression gate for the edge-level accuracy harness. Runs when a PR
# touches the extraction pipeline or the bench/accuracy/ tooling itself.
# Indexes two small fixtures (self-host code-graph Go, plus the synthetic
# prove-the-instrument fixtures) and fails the job if F1 regresses more
# than 5pp on any of them.
#
# Phase C of the 2026-05-14 grade-lift roadmap added two adversarial-F1
# floor gates (flask-adversarial, requests-adversarial). Those fixtures
# are pulled via actions/checkout at the SHA pinned in fixtures.json,
# then check_adversarial_f1.py asserts scope-aligned F1 >= floor. Locks
# in the Phase A+B gains (flask 0.492 -> 0.573, requests 0.394 -> 0.619).
#
# Fixtures still runnable LOCALLY only (developer-local paths in
# fixtures.json): mcp-servers, psm. CI doesn't gate
# those — large diffs against PSM should be measured manually before merge.

on:
  pull_request:
    paths:
      - 'internal/cbm/**'
      - 'internal/pipeline/**'
      - 'internal/store/**'
      - 'internal/cypher/**'
      - 'internal/tools/**'
      - 'bench/accuracy/**'
      - '.github/workflows/accuracy-regression.yml'
  push:
    branches: [main]
    paths:
      - 'internal/cbm/**'
      - 'internal/pipeline/**'
      - 'internal/store/**'
      - 'internal/cypher/**'
      - 'internal/tools/**'
      - 'bench/accuracy/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accuracy:
    if: github.repository_owner != 'redacted-brandyn'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Build code-graph
        run: |
          CGO_ENABLED=1 go build -o bin/codebase-memory-mcp ./cmd/codebase-memory-mcp/

      - name: Run CBM↔resolver QN-format contract tests (Family A — incident #2 coverage)
        run: |
          # Contract test: CBM's emitted Definition.QualifiedName must
          # match fqn.Compute's output for the same project/relPath.
          # Any drift between the two (incident #2 shape) silently
          # breaks resolveViaSameModule for every same-package callee.
          # Closes the last gap in Family A coverage from PR #182.
          go test ./internal/cbm/ -run TestCBMResolverQNContract -v

      - name: Run internal/tools tests (scope guards, ambiguity, security surfaces)
        run: |
          # Covers internal/tools/* unit tests including scope_guards_test.go
          # (degree_filter exclude_entry_points + trace_call_path ambiguity).
          # Without this step, tools-only PRs land without exercising tests
          # in the same package — surfaced 2026-05-14 when PR #310's
          # scope_guards tests passed locally but accuracy-regression
          # didn't fire because internal/tools wasn't in the path filter.
          go test ./internal/tools/ -count=1

      - name: Install Python test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas

      - name: Run scorer fixtures (Family A — pure-function tests on score_entities)
        run: |
          # Family A leg of the measurement-discipline pay-down. Pure
          # pytest unit tests on bench/research/eval_locbench_compare.py::
          # score_entities. Catches ACC-012 (class_hit forced False for
          # module-level GTs) and ~10 other edge cases at PR time before
          # any benchmark report can run.
          python -m pytest bench/research/test_score_entities.py -v

      - name: Run report-invariant gate (Family C — mechanical refusal)
        run: |
          # Family C leg of the measurement-discipline pay-down. Pytest
          # tests on _check_report_invariants. Verifies the gate refuses
          # reports with non-monotone hierarchies (ACC-012 shape),
          # dominant failure cells without classification (incident #1
          # shape), or external comparators without metric-equivalence
          # notes (incident #4 shape). Catches violations at the report-
          # writing layer before any benchmark number escapes.
          python -m pytest bench/research/test_report_invariants.py -v

      - name: Run provenance manifest gate (Family B — generation context tracking)
        run: |
          # Family B leg of the measurement-discipline pay-down. Pytest
          # tests on the provenance manifest computation, render/parse
          # round-trip, and comparison gate. Catches the bug-class where
          # two reports are compared across mismatched generation contexts
          # (different binaries, dataset versions, scorer schemas, agent
          # iterations) — incidents 1, 5, 6, 7 from the 2026-05-04
          # back-port. Largest-coverage gate of the three (4/7 incidents).
          python -m pytest bench/research/test_provenance.py -v

      - name: Run negative-fixture gate helpers tests (path-portable QN rewrite)
        run: |
          # Unit tests for check_negative_fixtures.py's QN-rewrite logic.
          # The helper enables ground-truth fixtures to move across
          # machines (developer ↔ CI runner) without 100% recall loss
          # — pre-fix, every CI run reported "POSITIVE-CONTROL MISS"
          # because GT QNs contained the dev machine's path-derived
          # project prefix verbatim.
          python -m pytest bench/accuracy/test_check_negative_fixtures.py -v

      - name: Build Rust oracle
        working-directory: bench/accuracy/tools/oracle-rust-syn
        run: cargo build --release

      - name: Build Go oracle
        working-directory: bench/accuracy/tools/oracle-go-ast
        run: go build -o oracle-go-ast .

      - name: Run Go oracle unit tests (Family A — recv.method, Y.5/Y.6 substitution)
        working-directory: bench/accuracy/tools/oracle-go-ast
        run: go test -v ./...

      - name: Run Rust synthetic prove-the-instrument
        run: |
          # Oracle emits edges; compare against hand-authored ground truth
          # in synthetic/rust-minimal/ground_truth.json.
          ./bench/accuracy/tools/oracle-rust-syn/target/release/oracle-rust-syn \
            bench/accuracy/synthetic/rust-minimal rust-minimal > /tmp/rust-min.json
          python - <<'PY'
          import json
          with open('/tmp/rust-min.json') as f:
              out = json.load(f)
          with open('bench/accuracy/synthetic/rust-minimal/ground_truth.json') as f:
              gt = json.load(f)
          expected_calls = {(e['from_qn'], e['to_qn']) for e in gt['expected_internal_calls']}
          expected_imports = {(e['from_qn'], e['to_qn']) for e in gt['expected_internal_imports']}
          actual_calls = {(e['from_qn'], e['to_qn']) for e in out['edges'] if e['type'] == 'CALLS'}
          actual_imports = {(e['from_qn'], e['to_qn']) for e in out['edges'] if e['type'] == 'IMPORTS'}
          missing_c = expected_calls - actual_calls
          missing_i = expected_imports - actual_imports
          if missing_c or missing_i:
              print(f'FAIL: missing CALLS={missing_c}, IMPORTS={missing_i}')
              raise SystemExit(1)
          print(f'PASS: rust-minimal FP=0 FN=0 ({len(expected_calls)} CALLS, {len(expected_imports)} IMPORTS)')
          PY

      - name: Run Go synthetic prove-the-instrument
        run: |
          # Oracle emits edges; the key synthetic check is the init-chain
          # filter (package-init edges shouldn't be emitted) and proper
          # _test.go suffix handling.
          ./bench/accuracy/tools/oracle-go-ast/oracle-go-ast \
            bench/accuracy/synthetic/go-minimal go-minimal > /tmp/go-min.json
          python - <<'PY'
          import json
          with open('/tmp/go-min.json') as f:
              out = json.load(f)
          with open('bench/accuracy/synthetic/go-minimal/ground_truth.json') as f:
              gt = json.load(f)
          expected = {(e['from_qn'], e['to_qn']) for e in gt['expected_internal_calls']}
          actual = {(e['from_qn'], e['to_qn']) for e in out['edges'] if e['type'] == 'CALLS'}
          missing = expected - actual
          if missing:
              print(f'FAIL: missing CALLS={missing}')
              raise SystemExit(1)
          print(f'PASS: go-minimal CALLS subset match ({len(expected)}/{len(expected)})')
          PY

      - name: Run negative-fixture regression gate
        run: |
          # Negative fixtures (synthetic/rust-diesel-negative/, etc.) check that
          # code-graph does NOT emit phantom CALLS edges from external chain
          # methods to internal targets via bare-name suffix-match. Independent
          # of the syn-oracle path. Fails if phantom_count exceeds the per-fixture
          # baseline pinned in negative_baselines.json.
          # Authored 2026-05-02 per roundtable Recommendation #1.
          python bench/accuracy/check_negative_fixtures.py --regression-gate

      - name: Run cypher-semantics regression gate (PR #308 CONTAINS-on-array)
        run: |
          # Pins PR #308's element-of semantics for CONTAINS on []string and
          # []any node properties (decorators, return_types). Without this
          # gate, a future refactor of the Cypher executor's CONTAINS branch
          # could silently regress array operands back to substring-on-string
          # semantics (the pre-PR-#308 shape), and every query of the form
          # `WHERE x.decorators CONTAINS '<element>'` would return 0 rows.
          # Surfaced by the 2026-05-13 PSM tool-comparison battery as a
          # deployed-but-undetected regression for ~24 hours post-merge.
          python bench/accuracy/check_cypher_semantics.py

      - name: Self-host Go baseline (code-graph indexing code-graph)
        run: |
          # Index one subset (internal/store) and assert edge count is within
          # a reasonable range vs the frozen baseline. Store/Cypher are
          # well-tested, so large drops indicate regression.
          mkdir -p /tmp/cg-cache
          HOME=/tmp/cg-home ./bin/codebase-memory-mcp cli index_repository \
            '{"repo_path":"internal/store","skip_report":true,"force":true}' | tail -5
          # Count CALLS edges in the indexed project.
          PROJECT="tmp-cg-home--root-work-code-graph-code-graph-internal-store"
          # (Actual project name varies by runner workspace; leaving the
          # exact count check as a smoke test rather than an exact assertion.
          # The hard gate is on synthetic fixtures where counts are stable.)
          echo 'self-host index completed'

      # ---------------------------------------------------------------
      # Adversarial-F1 regression gates (Phase C, 2026-05-14)
      #
      # Fetch flask + requests at the pinned SHAs from fixtures.json,
      # then run compare.py and assert scope-aligned CALLS F1 floors.
      # Pins the gains from Phase A (fuzzy-Janusian drop default-on,
      # PR #315) and Phase B (Python relative-import resolution,
      # PR #316). Catches accidental rollbacks of either at PR time.
      #
      # Floors set ~2-3pp below 2026-05-14 measurement to absorb
      # runner-noise without masking real regressions:
      #   flask:    measured 0.573 -> floor 0.55
      #   requests: measured 0.619 -> floor 0.60
      # ---------------------------------------------------------------

      - name: Fetch flask fixture (pinned SHA from fixtures.json)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: pallets/flask
          ref: 2ac89889f4cc330eabd50f295dcef02828522c69
          path: _fixtures/flask
          persist-credentials: false

      - name: Fetch requests fixture (pinned SHA from fixtures.json)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: psf/requests
          ref: f43f750ee10addbaa13901c1017631b4d70fd6e3
          path: _fixtures/requests
          persist-credentials: false

      - name: Run flask-adversarial F1 regression gate
        env:
          CODE_GRAPH_FIXTURE_PATH_FLASK_ADVERSARIAL: ${{ github.workspace }}/_fixtures/flask
        run: |
          python bench/accuracy/check_adversarial_f1.py \
            --fixture flask-adversarial \
            --min-f1 0.55

      - name: Run requests-adversarial F1 regression gate
        env:
          CODE_GRAPH_FIXTURE_PATH_REQUESTS_ADVERSARIAL: ${{ github.workspace }}/_fixtures/requests
        run: |
          python bench/accuracy/check_adversarial_f1.py \
            --fixture requests-adversarial \
            --min-f1 0.60

      - name: Summary
        if: always()
        run: |
          echo "Accuracy regression gate: prove-the-instrument synthetic fixtures passed."
          echo "Full baseline F1 on mcp-servers, psm, flask, cobra"
          echo "runs locally (fixtures not in repo). Contributors should run:"
          echo "  python bench/accuracy/compare.py <fixture-id>"
          echo "before significant extractor changes."
