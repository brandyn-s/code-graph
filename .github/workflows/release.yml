name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.0.2)"
        required: true
        type: string
      release_notes:
        description: "Release notes (optional — auto-generated from commits if empty)"
        required: false
        type: string

concurrency:
  group: code-graph-release
  cancel-in-progress: false

env:
  # Full-repository lint currently contains inherited debt. This accepted
  # ancestor is fixed, and the blocking gate below rejects findings added
  # after it. Move this baseline only through a reviewed debt-baseline change.
  LINT_BASELINE: 832bede03d6118827919fc8727f3c17854047d06

# Workflow-level default. Jobs are read-only unless they declare the narrowly
# scoped write permissions needed to attest or publish a release.
permissions:
  contents: read

jobs:
  preflight:
    if: github.repository_owner != 'redacted-brandyn'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test fail-closed release state machine
        run: |
          python3 -m unittest \
            scripts.test_release_version \
            scripts.test_release_workflow \
            scripts.test_release_workflow_acceptance

      - name: Verify immutable release inputs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: bash scripts/release_workflow.sh validate

  lint:
    if: github.repository_owner != 'redacted-brandyn'
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify lint baseline ancestry
        run: git merge-base --is-ancestor "$LINT_BASELINE" "$GITHUB_SHA"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10
          args: --timeout=10m --new-from-rev=${{ env.LINT_BASELINE }}

      - name: Report full lint debt
        continue-on-error: true
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10
          args: --timeout=10m

  build-unix:
    if: github.repository_owner != 'redacted-brandyn'
    needs: [lint]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: macos-14
            goos: darwin
            goarch: arm64
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Run tests
        run: go test ./...

      - name: Build binary
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Strip leading 'v' — version var should be bare semver (e.g. 0.4.0)
          CLEAN_VERSION="${VERSION#v}"
          CGO_ENABLED=1 go build \
            -ldflags "-X main.version=$CLEAN_VERSION" \
            -o codebase-memory-mcp \
            ./cmd/codebase-memory-mcp/

      - name: Smoke test
        run: bash scripts/smoke-test.sh ./codebase-memory-mcp

      - name: Create archive
        run: tar -czf codebase-memory-mcp-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz codebase-memory-mcp

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codebase-memory-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "*.tar.gz"

  build-windows:
    if: github.repository_owner != 'redacted-brandyn'
    needs: [lint]
    runs-on: windows-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Run tests
        shell: msys2 {0}
        run: |
          which go
          go version
          go test ./...

      - name: Build binary
        shell: msys2 {0}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Strip leading 'v' — version var should be bare semver (e.g. 0.4.0)
          CLEAN_VERSION="${VERSION#v}"
          CGO_ENABLED=1 CC=gcc go build \
            -ldflags "-X main.version=$CLEAN_VERSION -extldflags '-static'" \
            -o codebase-memory-mcp.exe \
            ./cmd/codebase-memory-mcp/

      - name: Smoke test
        shell: msys2 {0}
        run: bash scripts/smoke-test.sh ./codebase-memory-mcp.exe

      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path codebase-memory-mcp.exe -DestinationPath codebase-memory-mcp-windows-amd64.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codebase-memory-mcp-windows-amd64
          path: "*.zip"

  attest:
    if: github.repository_owner != 'redacted-brandyn'
    needs: [build-unix, build-windows]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Generate checksums for attestation subjects
        run: sha256sum -- *.tar.gz *.zip > checksums.txt

      - name: Generate build provenance attestations
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: checksums.txt

  release:
    if: github.repository_owner != 'redacted-brandyn'
    needs: [attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum -- *.tar.gz *.zip > checksums.txt

      - name: Recheck immutable release inputs
        id: release-state
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: bash scripts/release_workflow.sh validate

      - name: Create immutable tag if absent
        env:
          TAG_EXISTS: ${{ steps.release-state.outputs.tag_exists }}
          VERSION: ${{ inputs.version }}
        run: bash scripts/release_workflow.sh tag

      - name: Create or resume immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_STATE: ${{ steps.release-state.outputs.release_state }}
          VERSION: ${{ inputs.version }}
        run: bash scripts/release_workflow.sh publish
