name: drift-checks

# Phase A3 + A2 of the post-roundtable cross-tool primitives plan.
#
# Two drift checks run on a weekly schedule + manual dispatch:
#   1. Tree-sitter grammar canary (parse-shape stability per language)
#   2. confidence_band threshold recalibration (n=18,783 baseline drift alert)
#
# Both surface drift as workflow failures. Operators rebaseline via the
# documented commands when drift is intentional (grammar update, indirect-
# call extractor change). When drift is unexpected, the failure is the
# signal to investigate.
#

on:
  schedule:
    # Weekly on Monday 06:00 UTC (low-activity window).
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'internal/cbm/extract_calls.c'
      - 'internal/cbm/vendored/grammars/**'
      - 'bench/research/confidence_band_distribution.py'
      - 'bench/research/grammar_drift_check.py'
      - 'bench/research/grammar_canaries/**'
      - '.github/workflows/drift-checks.yml'

permissions:
  contents: read

jobs:
  grammar-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Run grammar canary check
        run: |
          python bench/research/grammar_drift_check.py
        # Non-zero exit = drift detected. Comment in the PR or issue with
        # the language(s) that regressed and the procedure to rebaseline.

  confidence-band-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: []
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Confidence-band probe smoke check (CI-runnable)
        run: |
          python bench/research/confidence_band_distribution.py --ci-smoke

      - name: Drift-detection contract validation
        run: |
          # CI doesn't have ~/.cache/code-graph/*.db. The real
          # drift detection (--check-drift, B3) runs on developer
          # machines or in a cron job with access to indexed projects.
          # This CI step validates the contract: --check-drift must
          # fail-loud (exit 1) when no DBs are present, never silently
          # pass. The fail-loud-on-no-data behavior is the safety
          # property we want preserved across refactors.
          set +e
          out=$(python bench/research/confidence_band_distribution.py --check-drift 2>&1)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::--check-drift exited 0 with no DBs — drift detection silently passing!"
            echo "$out"
            exit 1
          fi
          echo "OK: --check-drift correctly fails-loud when no DBs present"
          echo "$out" | head -5
          echo ""
          echo "Run on developer machines (where ~/.cache/code-graph/*.db exists):"
          echo "  python bench/research/confidence_band_distribution.py --check-drift"
          echo ""
          echo "If drift detected and the cause is a known extractor change,"
          echo "rebaseline with:"
          echo "  python bench/research/confidence_band_distribution.py --update-drift-baseline"
